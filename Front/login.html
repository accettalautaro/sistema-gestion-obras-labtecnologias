<!DOCTYPE html>
<html lang="en" class="login-style">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar</title>
    <script src="Scrips/app.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet">
    <link rel="stylesheet" href="estilo/style.css">
</head>
<body class="login-style">
    <header class="header-scrolled">   
        <nav >
            <div class=" navegacion scrolled" >
                <img  src="Imagenes/logoAccettaSinMargenes.png" alt="logo empresa" class="imagen-izquierda" >
            <div class="hamburguer" id="hamburguer">
                <img src="Imagenes/menu.png" alt="menu">
            </div>
            <ul class="links" id="links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="proyectos.html">Proyectos</a></li>
                <li><a href="formulario.html">Contacto</a></li>
                <li><a href="login.html">Ingresar</a></li>
                <li><a href="https://www.instagram.com/vascoaccetta/" target="_blank">
                    <img class="instagram-logo" src="Imagenes/instagramlogo.png" alt="logo instagram" >
                </a></li>
            </ul>
            </div>
            
        </nav>
    </header>
    <main class=" main contenido-principal">
        <div class="container-fluid">
            <div class="row" style="height: 100vh;">
                <div class="col-9">
                    <section class="login-imagen"></section>
                </div>
                <div class="col-3">
                    <form class="form-login" action="#" method="post">
                    <label for="dni">DNI:</label>
                    <input type="number" id="dni" name="dni" required><br>
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" required><br>
                    <div class="checkbox-container">
                        <input type="checkbox" id="recordar" name="recordar">
                        <label for="recordar">Recordá tu DNI</label>
                    </div>
                    <button type="submit">Ingresar</button>
                    <label for="contacto" id="contacto">¿No tienes cuenta? Ponte en contacto para iniciar un proyecto nuevo y obtener una cuenta<a href="formulario.html"><br><br>Click aquí</a></label>
                    </form>
                    <footer>
                        <a href="https://www.instagram.com/vascoaccetta/" target="_blank">
                        <img class="instagram-logo" src="Imagenes/instagramlogo.png" alt="logo instagram" >
                        </a>
                        <p>Copyright © 2026 Sistema Gestion de Obras. Todos los derechos reservados.</p>
                    </footer>
                </div> 
            </div>   
        </div>
    </main>    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
