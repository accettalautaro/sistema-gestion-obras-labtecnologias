    <main>
        <h1>Contacto</h1>
        <h2>Arquitecto Accetta</h2>
        <p>Nombre: Marcelo Accetta</p>
        <p>Email:<a href="mailto:arqaccetta@gmail.com">arqaccetta@gmail.com</a></p>
        <p>Telefono: 2657-657808</p>
        <h2>Formulario de Contacto</h2>
        <form action="#" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required><br>
            <label for="correo">Correo electronico:</label>
            <input type="email" id="correo" name="correo" required><br>
            <label for="telefono">Telefono:</label>
            <input type="number" id="telefono" name="telefono" minlength="10" maxlength="10" required><br>
            <label for="asunto">Asunto:</label>
            <select id="asunto" name="asunto" required>
                <option value="">Seleccione un asunto</option>
                <option value="consulta">Consulta</option>
                <option value="sugerencia">Sugerencia</option>
                <option value="reclamo">Reclamo</option>  
            <select><br>
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="5" required></textarea><br>    
            
            <button type="submit">Enviar</button>
        </form>
    </main>
