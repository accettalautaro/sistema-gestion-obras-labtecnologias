$kind: http-request
name: DELETE /terrenos/{{idNuevoLote}} - eliminar lote temporal
url: "{{baseUrl}}/api/terrenos/{{idNuevoLote}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 5000
