$kind: http-request
name: GET /terrenos/{{idNuevoLote}} - lote creado
url: "{{baseUrl}}/api/terrenos/{{idNuevoLote}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
