$kind: http-request
name: PUT /terrenos/{{idNuevoLote}} - actualizar lote temporal
url: "{{baseUrl}}/api/terrenos/{{idNuevoLote}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nro_lote": "PM-ACT-{{$timestamp}}",
      "id_direccion": null
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
