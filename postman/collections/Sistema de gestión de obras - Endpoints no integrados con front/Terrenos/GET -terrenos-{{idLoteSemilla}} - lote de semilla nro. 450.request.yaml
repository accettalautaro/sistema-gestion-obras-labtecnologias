$kind: http-request
name: GET /terrenos/{{idLoteSemilla}} - lote de semilla nro. 450
url: "{{baseUrl}}/api/terrenos/{{idLoteSemilla}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
