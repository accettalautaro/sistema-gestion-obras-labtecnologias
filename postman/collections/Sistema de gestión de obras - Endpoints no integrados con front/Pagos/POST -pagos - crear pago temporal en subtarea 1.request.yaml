$kind: http-request
name: POST /pagos - crear pago temporal en subtarea 1
url: "{{baseUrl}}/api/pagos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_subtarea": 1,
      "descripcion": "Pago temporal Postman",
      "monto": 1000
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      if ([200, 201].includes(pm.response.code)) { const d = pm.response.json(); pm.collectionVariables.set('idNuevoPago', String(d.id_pago)); }
    language: text/javascript
order: 3000
