$kind: http-request
name: DELETE /pagos/{{idNuevoPago}} - eliminar pago temporal
url: "{{baseUrl}}/api/pagos/{{idNuevoPago}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 6000
