$kind: http-request
name: GET /pagos/{{idPagoSemilla}} - pago de semilla
url: "{{baseUrl}}/api/pagos/{{idPagoSemilla}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
