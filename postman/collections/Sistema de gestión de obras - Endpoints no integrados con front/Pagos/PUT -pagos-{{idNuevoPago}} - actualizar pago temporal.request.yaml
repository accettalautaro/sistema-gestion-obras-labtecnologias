$kind: http-request
name: PUT /pagos/{{idNuevoPago}} - actualizar pago temporal
url: "{{baseUrl}}/api/pagos/{{idNuevoPago}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_subtarea": 1,
      "descripcion": "Pago temporal actualizado",
      "monto": 1500
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
