$kind: http-request
name: DELETE /terrenos/mensuras/{{idNuevoMensura}} - eliminar mensura temporal
url: "{{baseUrl}}/api/terrenos/mensuras/{{idNuevoMensura}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 6000
