$kind: http-request
name: PUT /terrenos/escrituras/{{idNuevoDocumento}} - actualizar escritura temporal
url: "{{baseUrl}}/api/terrenos/escrituras/{{idNuevoDocumento}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Escritura temporal actualizada",
      "nro_escritura": "PM-ACT-{{$timestamp}}",
      "descripcion": "Actualización de prueba",
      "archivo": null
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
