$kind: http-request
url: "{{baseUrl}}/api/terrenos/escrituras/{{idNuevoDocumento}}/propietarios/{{idPropietarioSemilla}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 7000
