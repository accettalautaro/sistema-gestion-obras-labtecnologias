$kind: http-request
name: GET /terrenos/escrituras/{{idNuevoDocumento}} - escritura creada
url: "{{baseUrl}}/api/terrenos/escrituras/{{idNuevoDocumento}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
