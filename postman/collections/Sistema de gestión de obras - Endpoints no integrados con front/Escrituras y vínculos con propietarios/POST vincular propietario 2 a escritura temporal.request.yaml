$kind: http-request
url: "{{baseUrl}}/api/terrenos/escrituras/{{idNuevoDocumento}}/propietarios/{{idPropietarioSemilla}}"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 6000
