$kind: http-request
name: DELETE /terrenos/escrituras/{{idNuevoDocumento}} - eliminar escritura temporal
url: "{{baseUrl}}/api/terrenos/escrituras/{{idNuevoDocumento}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 8000
