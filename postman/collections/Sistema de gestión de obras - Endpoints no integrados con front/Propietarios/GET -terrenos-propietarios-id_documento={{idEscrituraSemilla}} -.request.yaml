$kind: http-request
name: GET /terrenos/propietarios?id_documento={{idEscrituraSemilla}} - propietarios de escritura 2
url: "{{baseUrl}}/api/terrenos/propietarios?id_documento={{idEscrituraSemilla}}"
method: GET
queryParams:
  id_documento: "{{idEscrituraSemilla}}"
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
