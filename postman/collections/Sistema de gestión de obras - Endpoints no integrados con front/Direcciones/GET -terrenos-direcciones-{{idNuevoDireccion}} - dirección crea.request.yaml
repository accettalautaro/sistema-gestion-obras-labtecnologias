$kind: http-request
name: GET /terrenos/direcciones/{{idNuevoDireccion}} - dirección creada
url: "{{baseUrl}}/api/terrenos/direcciones/{{idNuevoDireccion}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
