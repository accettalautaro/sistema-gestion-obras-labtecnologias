$kind: http-request
name: POST /terrenos/direcciones - crear dirección temporal
url: "{{baseUrl}}/api/terrenos/direcciones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "provincia": "San Luis",
      "codigo_postal": "5700",
      "calle": "Dirección temporal Postman",
      "altura": "100",
      "piso": null,
      "departamento": null,
      "localidad": "San Luis"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      if ([200, 201].includes(pm.response.code)) { const d = pm.response.json(); pm.collectionVariables.set('idNuevoDireccion', String(d.id_direccion)); }
    language: text/javascript
order: 3000
