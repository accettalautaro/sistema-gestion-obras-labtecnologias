$kind: http-request
name: PUT /terrenos/direcciones/{{idNuevoDireccion}} - actualizar dirección temporal
url: "{{baseUrl}}/api/terrenos/direcciones/{{idNuevoDireccion}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "provincia": "San Luis",
      "codigo_postal": "5700",
      "calle": "Dirección temporal actualizada",
      "altura": "101",
      "piso": null,
      "departamento": null,
      "localidad": "San Luis"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
