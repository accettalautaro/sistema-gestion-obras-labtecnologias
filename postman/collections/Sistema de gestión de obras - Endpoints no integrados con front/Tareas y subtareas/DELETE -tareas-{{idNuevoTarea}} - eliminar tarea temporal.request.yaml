$kind: http-request
name: DELETE /tareas/{{idNuevoTarea}} - eliminar tarea temporal
url: "{{baseUrl}}/api/tareas/{{idNuevoTarea}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 6000
