$kind: http-request
name: POST /subtareas - crear subtarea temporal en tarea 1
url: "{{baseUrl}}/api/subtareas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_tarea": 1,
      "nombre": "Subtarea temporal Postman",
      "duracion_estimada": 1,
      "porcentaje": 0,
      "descripcion": "Prueba de colección",
      "duracion_real": 0,
      "costo_estimado": 500,
      "costo_real": 0,
      "fecha_inicio": "2026-10-28",
      "fecha_fin": "2026-10-29"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      if ([200, 201].includes(pm.response.code)) { const d = pm.response.json(); pm.collectionVariables.set('idNuevoSubtarea', String(d.id_subtarea)); }
    language: text/javascript
order: 8000
