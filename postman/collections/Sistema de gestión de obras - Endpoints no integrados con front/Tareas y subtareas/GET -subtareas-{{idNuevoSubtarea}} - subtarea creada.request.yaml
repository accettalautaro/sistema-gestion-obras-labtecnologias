$kind: http-request
name: GET /subtareas/{{idNuevoSubtarea}} - subtarea creada
url: "{{baseUrl}}/api/subtareas/{{idNuevoSubtarea}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 9000
