$kind: http-request
name: DELETE /subtareas/{{idNuevoSubtarea}} - eliminar subtarea temporal
url: "{{baseUrl}}/api/subtareas/{{idNuevoSubtarea}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 11000
