$kind: http-request
name: "GET /tareas/{{idTareaSemilla}} - tarea de semilla: TRABAJOS PRELIMINARES"
url: "{{baseUrl}}/api/tareas/{{idTareaSemilla}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
