$kind: http-request
name: GET /recordatorios/{{idNuevoRecordatorio}} - recordatorio creado
url: "{{baseUrl}}/api/recordatorios/{{idNuevoRecordatorio}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
