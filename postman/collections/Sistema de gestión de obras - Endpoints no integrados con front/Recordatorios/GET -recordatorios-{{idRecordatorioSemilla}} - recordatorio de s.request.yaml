$kind: http-request
name: GET /recordatorios/{{idRecordatorioSemilla}} - recordatorio de semilla
url: "{{baseUrl}}/api/recordatorios/{{idRecordatorioSemilla}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenArquitecto}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
